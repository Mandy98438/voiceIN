<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Voice Link</title>
<style>
  :root{
    --bg:#0A0C10;
    --panel:#12151B;
    --border:#1E232B;
    --text:#E7ECEF;
    --text-dim:#6C7683;
    --accent:#35D0B0;
    --accent-dim:#1E4A42;
    --danger:#FF5D5D;
    --warn:#F0A93A;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:var(--sans);
    background:
      radial-gradient(circle at 50% -10%, #141922 0%, var(--bg) 55%);
    color:var(--text);
    padding:36px 20px calc(28px + env(safe-area-inset-bottom));
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100%;
  }

  .titles{ text-align:center; margin-bottom:22px; }
  h1{
    margin:0;
    font-size:19px;
    font-weight:600;
    letter-spacing:.2px;
  }
  .titles p{
    margin:6px 0 0;
    font-size:13px;
    color:var(--text-dim);
  }

  /* IP field, inline, editorial not boxy */
  .ip-field{
    display:flex;
    align-items:center;
    gap:8px;
    margin:0 0 30px;
    padding:8px 6px;
    border-bottom:1px solid var(--border);
    max-width:280px;
    width:100%;
  }
  .ip-field label{
    font-size:11px;
    color:var(--text-dim);
    white-space:nowrap;
  }
  .ip-field input{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:var(--text);
    font-family:var(--mono);
    font-size:14px;
    text-align:right;
  }
  .ip-field input:disabled{ color:var(--text-dim); }

  /* Hero mic control */
  .mic-wrap{
    position:relative;
    width:172px;
    height:172px;
    margin:6px 0 18px;
  }
  .ring{ position:absolute; inset:0; transform:rotate(-90deg); }
  .ring-bg{
    fill:none;
    stroke:var(--border);
    stroke-width:3;
  }
  .ring-level{
    fill:none;
    stroke:var(--accent);
    stroke-width:3;
    stroke-linecap:round;
    stroke-dasharray:452.4;
    stroke-dashoffset:452.4;
    transition:stroke-dashoffset .06s linear, stroke .2s;
  }

  .mic-btn{
    position:absolute;
    inset:18px;
    border-radius:50%;
    border:none;
    cursor:pointer;
    background:var(--panel);
    box-shadow: inset 0 0 0 1px var(--border);
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background .25s, box-shadow .25s, transform .1s;
  }
  .mic-btn:active{ transform:scale(.97); }
  .mic-btn svg{ width:38px; height:38px; }
  .mic-btn .icon-mic{ stroke:var(--text); }
  .mic-btn .icon-stop{ fill:var(--danger); display:none; }

  .mic-btn.recording{
    background:radial-gradient(circle, rgba(53,208,176,.14), transparent 70%), var(--panel);
    box-shadow: inset 0 0 0 1px var(--accent-dim);
  }
  .mic-btn.recording .icon-mic{ display:none; }
  .mic-btn.recording .icon-stop{ display:block; }

  .mic-btn.speaking{ box-shadow: inset 0 0 0 1px var(--accent), 0 0 26px rgba(53,208,176,.35); }

  .state-line{
    height:20px;
    font-size:13.5px;
    color:var(--text-dim);
    margin-bottom:8px;
    display:flex;
    align-items:center;
    gap:7px;
  }
  .dot{ width:7px; height:7px; border-radius:50%; background:var(--text-dim); flex-shrink:0; }
  .dot.connecting{ background:var(--warn); animation:pulse 1s infinite; }
  .dot.connected{ background:var(--accent); }
  .dot.disconnected{ background:var(--danger); }
  @keyframes pulse{ 50%{ opacity:.25; } }

  /* Stats panel */
  .panel{
    margin-top:22px;
    width:100%;
    max-width:340px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    display:flex;
  }
  .stat{
    flex:1;
    padding:14px 8px;
    text-align:center;
    border-right:1px solid var(--border);
  }
  .stat:last-child{ border-right:none; }
  .stat .val{
    font-family:var(--mono);
    font-size:15px;
    color:var(--text);
  }
  .stat .lbl{
    font-size:10.5px;
    color:var(--text-dim);
    margin-top:4px;
  }

  /* Log */
  #log{
    margin-top:22px;
    width:100%;
    max-width:520px;
    max-height:130px;
    overflow-y:auto;
    background:#0B0E12;
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 14px;
    text-align:left;
    white-space:pre-wrap;
    font-family:var(--mono);
    font-size:11.5px;
    line-height:1.6;
    color:#5C8A7C;
  }
</style>
</head>
<body>

<div class="titles">
  <h1>Voice Link</h1>
  <p>Streaming to ESP32-S3</p>
</div>

<div class="ip-field">
  <label for="ipInput">device</label>
  <input id="ipInput" type="text" value="192.168.1.100" inputmode="decimal">
</div>

<div class="mic-wrap">
  <svg class="ring" viewBox="0 0 160 160">
    <circle class="ring-bg" cx="80" cy="80" r="72"/>
    <circle class="ring-level" id="ringLevel" cx="80" cy="80" r="72"/>
  </svg>
  <button id="micBtn" class="mic-btn">
    <svg class="icon-mic" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
      <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
      <line x1="12" y1="19" x2="12" y2="23"/>
      <line x1="8" y1="23" x2="16" y2="23"/>
    </svg>
    <svg class="icon-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
  </button>
</div>

<div class="state-line">
  <div class="dot disconnected" id="dot"></div>
  <span id="status">Tap to connect</span>
</div>

<div class="panel">
  <div class="stat"><div class="val" id="bytesSent">0 KB</div><div class="lbl">sent</div></div>
  <div class="stat"><div class="val" id="sendRate">0 kbps</div><div class="lbl">rate</div></div>
  <div class="stat"><div class="val" id="elapsed">00:00</div><div class="lbl">time</div></div>
</div>

<div id="log"></div>

<script>
const statusEl = document.getElementById("status");
const dotEl = document.getElementById("dot");
const micBtn = document.getElementById("micBtn");
const ringLevel = document.getElementById("ringLevel");
const logEl = document.getElementById("log");
const ipInput = document.getElementById("ipInput");
const bytesSentEl = document.getElementById("bytesSent");
const sendRateEl = document.getElementById("sendRate");
const elapsedEl = document.getElementById("elapsed");

const SAMPLE_RATE = 16000;
const VAD_THRESHOLD = 12; // 0-100 scale, tune on device
const RING_CIRC = 452.4;

let websocket, audioContext, mediaStream, source, processor, analyser;
let wakeLock = null;
let reconnectAttempts = 0;
let reconnectTimer = null;
let manuallyStopped = true;

let totalBytes = 0;
let bytesSinceLastTick = 0;
let startTime = 0;
let statsTimer = null;

function log(msg){
  const t = new Date().toLocaleTimeString();
  logEl.textContent += `[${t}] ${msg}\n`;
  logEl.scrollTop = logEl.scrollHeight;
}

function setDot(state, label){
  dotEl.className = "dot " + state;
  if (label) statusEl.textContent = label;
}

function formatBytes(b){ return b > 1024 ? (b/1024).toFixed(1) + " KB" : b + " B"; }
function formatTime(s){
  const m = String(Math.floor(s/60)).padStart(2,"0");
  const sec = String(s%60).padStart(2,"0");
  return `${m}:${sec}`;
}

function connectWebSocket(){
  const ip = ipInput.value.trim();
  setDot("connecting", "Connecting to " + ip);
  websocket = new WebSocket("ws://" + ip + "/ws");
  websocket.binaryType = "arraybuffer";

  websocket.onopen = () => {
    reconnectAttempts = 0;
    setDot("connected", "Listening");
    log("Connected to ESP32 at " + ip);
  };

  websocket.onclose = () => {
    setDot("disconnected");
    if (!manuallyStopped){
      statusEl.textContent = "Reconnecting...";
      log("Disconnected. Reconnecting...");
      scheduleReconnect();
    } else {
      statusEl.textContent = "Tap to connect";
    }
  };

  websocket.onerror = () => log("WebSocket error");
}

function scheduleReconnect(){
  reconnectAttempts++;
  const delay = Math.min(1000 * reconnectAttempts, 5000);
  clearTimeout(reconnectTimer);
  reconnectTimer = setTimeout(() => { if (!manuallyStopped) connectWebSocket(); }, delay);
}

function convertToPCM(float32Array){
  const pcm = new Int16Array(float32Array.length);
  for (let i = 0; i < float32Array.length; i++){
    let sample = Math.max(-1, Math.min(1, float32Array[i]));
    pcm[i] = sample < 0 ? sample * 32768 : sample * 32767;
  }
  return pcm;
}

function updateLevel(){
  if (!analyser) return;
  const data = new Uint8Array(analyser.fftSize);
  analyser.getByteTimeDomainData(data);

  let sumSquares = 0;
  for (let i = 0; i < data.length; i++){
    const norm = (data[i] - 128) / 128;
    sumSquares += norm * norm;
  }
  const rms = Math.sqrt(sumSquares / data.length);
  const level = Math.min(100, rms * 220);

  ringLevel.style.strokeDashoffset = RING_CIRC - (RING_CIRC * level / 100);

  const speaking = level > VAD_THRESHOLD;
  micBtn.classList.toggle("speaking", speaking);
  if (websocket && websocket.readyState === WebSocket.OPEN){
    statusEl.textContent = speaking ? "Speaking" : "Listening";
  }

  requestAnimationFrame(updateLevel);
}

function updateStats(){
  const rateKbps = ((bytesSinceLastTick * 8) / 1000).toFixed(1);
  sendRateEl.textContent = rateKbps + " kbps";
  bytesSentEl.textContent = formatBytes(totalBytes);
  elapsedEl.textContent = formatTime(Math.floor((Date.now() - startTime) / 1000));
  bytesSinceLastTick = 0;
}

async function requestWakeLock(){
  try{
    if ("wakeLock" in navigator){
      wakeLock = await navigator.wakeLock.request("screen");
      log("Screen wake lock active");
    }
  } catch(e){ log("Wake lock unavailable: " + e.message); }
}

async function startRecording(){
  manuallyStopped = false;
  const ip = ipInput.value.trim();
  if (!ip){ log("Enter the ESP32 IP address first"); return; }

  try{
    mediaStream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount:1, echoCancellation:true, noiseSuppression:true, autoGainControl:true }
    });

    audioContext = new AudioContext({ sampleRate: SAMPLE_RATE });
    source = audioContext.createMediaStreamSource(mediaStream);

    analyser = audioContext.createAnalyser();
    analyser.fftSize = 1024;
    source.connect(analyser);

    processor = audioContext.createScriptProcessor(4096, 1, 1);
    processor.onaudioprocess = (event) => {
      if (!websocket || websocket.readyState !== WebSocket.OPEN) return;
      const input = event.inputBuffer.getChannelData(0);
      const pcm = convertToPCM(input);
      websocket.send(pcm.buffer);
      totalBytes += pcm.buffer.byteLength;
      bytesSinceLastTick += pcm.buffer.byteLength;
    };

    source.connect(processor);
    processor.connect(audioContext.destination);

    connectWebSocket();
    requestWakeLock();
    updateLevel();

    startTime = Date.now();
    statsTimer = setInterval(updateStats, 500);

    micBtn.classList.add("recording");
    ipInput.disabled = true;

  } catch(error){
    console.error(error);
    setDot("disconnected", "Microphone access failed");
    log("Microphone error: " + error.message);
  }
}

function stopRecording(){
  manuallyStopped = true;
  clearTimeout(reconnectTimer);
  clearInterval(statsTimer);

  if (processor){ processor.disconnect(); processor = null; }
  if (analyser){ analyser.disconnect(); analyser = null; }
  if (source){ source.disconnect(); source = null; }
  if (mediaStream){ mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
  if (audioContext){ audioContext.close(); audioContext = null; }
  if (websocket){ websocket.close(); websocket = null; }
  if (wakeLock){ wakeLock.release(); wakeLock = null; }

  ringLevel.style.strokeDashoffset = RING_CIRC;
  micBtn.classList.remove("recording", "speaking");
  setDot("disconnected", "Tap to connect");
  ipInput.disabled = false;
}

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && audioContext && !wakeLock) requestWakeLock();
});

micBtn.addEventListener("click", () => {
  if (micBtn.classList.contains("recording")) stopRecording();
  else startRecording();
});
</script>

</body>
</html>
